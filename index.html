<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Castillo de las Letras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Una columna de móvil centrada: mapa de reinos arriba, lección a pantalla completa abajo. */
  --bg:#FBF4FF; --card:#FFFFFF; --ink:#3A1646; --ink-soft:#7A5C86;
  --rose:#E0457B; --rose-d:#B82F61; --gold:#F5B52E; --mint:#2FB890; --sky:#6C63F0; --line:#EBDDF3;
  --display:'Grandstander','Trebuchet MS',system-ui,sans-serif;
  --body:'Andika','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
#app{min-height:100%;max-width:560px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:4px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 26px;border:0;border-radius:20px;background:var(--rose);color:#fff;font:800 1.2rem var(--display);box-shadow:0 5px 0 var(--rose-d);text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--rose-d)}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line);border:3px solid var(--line)}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 #1F8A6C}
.btn.sm{min-height:44px;padding:0 16px;font-size:1rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:46px;height:36px}
.brand h1{font-size:1.35rem}
.gems{background:#fff;border:3px solid var(--line);border-radius:999px;padding:4px 14px;font:800 1.1rem var(--display)}
.hero{background:var(--ink);color:#fff;border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:10px}
.hero small{opacity:.8;font-size:.95rem}
.hero h2{font-size:1.9rem}
.hero .btn{align-self:flex-start;margin-top:6px}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.reino{background:var(--card);border-radius:26px;padding:16px;border:3px solid var(--line)}
.reino h3{font-size:1.2rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.reino h3 i{width:14px;height:14px;border-radius:50%;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.node{aspect-ratio:1;border-radius:22px;border:3px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:800 1.5rem var(--display);position:relative;padding:0}
.node small{font:400 .8rem var(--body);color:var(--gold);letter-spacing:1px;min-height:1em}
.node .d{position:absolute;top:4px;left:8px;font:700 .7rem var(--body);color:var(--ink-soft)}
.node.done{background:color-mix(in srgb,var(--c) 14%,#fff);border-color:var(--c)}
.node.cur{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent);animation:pulse 1.8s ease-in-out infinite}
.node.lock{opacity:.4}
.foot{display:flex;justify-content:center;padding:6px 0 18px}
.notice{background:#FFF1D6;border-radius:16px;padding:10px 14px;font-size:.95rem}

.tabs{display:flex;gap:8px}
.tab{flex:1;min-height:56px;border-radius:18px;border:3px solid var(--line);background:#fff;font:800 1rem var(--display);padding:6px 8px;line-height:1.15}
.tab small{display:block;font:400 .78rem var(--body);color:var(--ink-soft)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.on small{color:#E9D9F2}
.ask{flex:none;width:56px;height:56px;border-radius:50%;border:0;background:var(--sky);color:#fff;font-size:1.6rem;box-shadow:0 5px 0 #4A42C4;padding:0}
.ask:active{transform:translateY(3px);box-shadow:0 2px 0 #4A42C4}
.vrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:3px solid var(--line);border-radius:16px;padding:8px 10px}
.vrow.on{border-color:var(--mint);background:#EEFBF6}
.vrow span{flex:1;min-width:140px;font-size:.95rem}
textarea.code{width:100%;min-height:84px;border:3px solid var(--line);border-radius:14px;padding:10px;font:400 .85rem/1.3 monospace;color:var(--ink);background:#fff;resize:vertical}
.ok-msg{color:var(--mint);font-weight:700}
.err-msg{color:var(--rose-d);font-weight:700}
.lessonbar{display:flex;align-items:center;gap:10px}
.back{width:48px;height:48px;border-radius:16px;border:3px solid var(--line);background:#fff;font-size:1.4rem}
.dots{display:flex;gap:6px;flex:1}
.dots i{flex:1;height:10px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--rose)}
.dots i.now{background:var(--gold)}
.lt{font:800 1.05rem var(--display)}
.stage{background:var(--card);border-radius:28px;padding:18px;border:3px solid var(--line);min-height:380px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.gh{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px}
.gt{font:800 1.25rem var(--display);text-align:left;flex:1}
.gr{background:var(--bg);border-radius:99px;padding:2px 12px;font-size:.9rem;white-space:nowrap}
.hint{margin:0;color:var(--ink-soft);font-size:1rem}
.fb{margin:0;min-height:1.5em;font:800 1.15rem var(--display);color:var(--mint)}
.spk{border:3px solid var(--line);background:var(--bg);border-radius:18px;min-height:52px;padding:0 20px;font:800 1.05rem var(--display)}
.tiles,.slots,.eq{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
.tile{min-width:84px;height:84px;padding:0 14px;border:3px solid var(--line);border-radius:22px;background:#fff;color:var(--ink);font:700 2.4rem var(--body);box-shadow:0 5px 0 var(--line);display:inline-flex;align-items:center;justify-content:center}
button.tile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.tile.good,.opt.good{background:#DDF6EC;border-color:var(--mint);box-shadow:0 0 0 7px rgba(47,184,144,.35),0 5px 0 #A9E5D0;animation:celeb .7s ease;position:relative;z-index:2}
.tile.used{opacity:.35}
.tile.fix{background:var(--rose);border-color:var(--rose-d);color:#fff;box-shadow:0 5px 0 var(--rose-d)}
.tile.slot{background:#F6EEFB;border-style:dashed;color:var(--ink-soft);box-shadow:none}
.tile.slot.filled{background:#fff;border-style:solid;color:var(--ink);box-shadow:0 5px 0 var(--line)}
.tile.sel{border-color:var(--sky)}
.eq b{font:800 2rem var(--display)}
.pic{font-size:5.5rem;line-height:1}
.word{font:700 3rem var(--body);letter-spacing:2px}
.sy.c0{color:var(--rose)}.sy.c1{color:var(--sky)}
.opts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.opt{width:92px;height:92px;border-radius:22px;border:3px solid var(--line);background:#fff;font-size:3rem;box-shadow:0 5px 0 var(--line);padding:0}
.card{width:100%;aspect-ratio:1;border-radius:18px;border:3px solid var(--line);background:var(--sky);color:#fff;font:700 2rem var(--body);padding:0}
.card.up{background:#fff;color:var(--ink)}
.card.ok{background:#DDF6EC;border-color:var(--mint);color:var(--ink)}
.mem{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.line{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--bg);border-radius:18px;padding:12px 14px;font:700 1.35rem var(--body)}
.line span{flex:1}
.line button{flex:none;width:48px;height:48px;border-radius:14px;border:3px solid var(--line);background:#fff}
.mission{background:#FFF7DD;border:3px solid var(--gold);border-radius:22px;padding:16px;width:100%;font-size:1.1rem}
.stars{font-size:3rem;color:var(--gold);letter-spacing:6px}
.stars .off{color:var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.panel{background:var(--card);border:3px solid var(--line);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:12px}
.panel ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.panel p{margin:0}
input.name{width:100%;min-height:60px;border:3px solid var(--line);border-radius:18px;padding:0 16px;font:700 1.5rem var(--body);text-align:center;color:var(--ink);background:#fff}
.big-crown{width:120px;height:92px}
.conf{position:fixed;top:-40px;animation:fall 2.2s ease-in forwards;pointer-events:none;z-index:50}
.shake{animation:shake .4s;border-color:var(--rose)!important;background:#FFE9F0!important}
.spark{position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:60;font-size:24px;animation:fly .85s ease-out forwards}
.banner{position:fixed;left:50%;top:16%;z-index:70;background:var(--mint);color:#fff;font:800 2rem var(--display);padding:12px 28px;border-radius:999px;box-shadow:0 8px 0 #1F8A6C;pointer-events:none;white-space:nowrap;transform:translateX(-50%);animation:bn 1.2s ease forwards}
.slot.filled{animation:pop .45s}
.pop{animation:pop .5s}
@keyframes fall{to{transform:translateY(110vh) rotate(260deg);opacity:.8}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes celeb{0%{transform:scale(1)}30%{transform:scale(1.32) rotate(-5deg)}60%{transform:scale(1.18) rotate(4deg)}100%{transform:scale(1.1)}}
@keyframes fly{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.5);opacity:0}}
@keyframes bn{0%{transform:translateX(-50%) scale(.4);opacity:0}22%{transform:translateX(-50%) scale(1.15);opacity:1}70%{transform:translateX(-50%) scale(1);opacity:1}100%{transform:translateX(-50%) translateY(-24px);opacity:0}}
@keyframes pop{40%{transform:scale(1.2)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:380px){.banner{font-size:1.6rem;padding:10px 20px}.tile{min-width:72px;height:72px;font-size:2rem}.word{font-size:2.4rem}.opt{width:80px;height:80px}}

.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtn{min-height:64px;border-radius:20px;border:3px solid var(--line);background:#fff;font:800 1rem var(--display);padding:8px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:left;line-height:1.1}
.mbtn small{display:block;font:400 .75rem var(--body);color:var(--ink-soft);margin-top:2px}
.mbtn.dis{opacity:.5}
.mbtn.chest{grid-column:1/-1;background:#FFF7DD;border-color:var(--gold)}
.mbtn.chest.new{animation:pulse 1.4s ease-in-out infinite}
.streak{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--line);border-radius:20px;padding:10px 12px}
.streak b{font:800 1rem var(--display)}
.wk{display:flex;gap:5px;margin-left:auto}
.wk i{width:22px;height:22px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font:700 .65rem var(--body);font-style:normal;color:#fff}
.wk i.on{background:var(--gold)}
.hero-row{display:flex;gap:12px;align-items:center;justify-content:space-between}
.hero-t{display:flex;flex-direction:column;gap:8px}
.hero-av{flex:none;position:relative;width:84px;height:100px;background:rgba(255,255,255,.14);border-radius:18px;display:flex;align-items:flex-end;justify-content:center}
.hero-av .av{width:84px;height:100px}
.hero-av .pet{position:absolute;right:-8px;bottom:-6px;font-size:1.7rem}
.gems{cursor:pointer;color:var(--ink)}
.scene{position:relative;width:100%;aspect-ratio:4/3;border-radius:24px;overflow:hidden;border:3px solid var(--line)}
.scene .ground{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(#7BD389,#4FB06A)}
.scene svg.castle{position:absolute;left:50%;bottom:18%;width:60%;transform:translateX(-50%)}
.scene .deco{position:absolute;font-size:2.1rem;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.scene .princ{position:absolute;left:50%;bottom:1%;width:28%;transform:translateX(-50%)}
.scene .princ svg{width:100%;display:block}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{border:3px solid var(--line);border-radius:18px;background:#fff;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem;line-height:1.15;text-align:center}
.item .ic{font-size:2rem;height:2.4rem;display:flex;align-items:center}
.item .pr{font-weight:700}
.item.on{border-color:var(--mint);background:#EEFBF6}
.item.sel{border-color:var(--sky);box-shadow:0 0 0 4px rgba(108,99,240,.25)}
.sw{display:inline-block;width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 4px var(--mint)}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.st{aspect-ratio:1;border-radius:16px;background:#fff;border:3px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:2rem;color:var(--ink-soft)}
.st.on{border-style:solid;border-color:var(--gold);background:#FFF7DD;cursor:pointer}
.cert{background:#fff;border:10px double var(--gold);border-radius:12px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.cert h2{font-size:1.7rem;color:var(--rose-d)}
.cert p{margin:0}
.cert .nm{font:800 2.2rem var(--display);word-break:break-word}
.modal{position:fixed;inset:0;background:rgba(58,22,70,.55);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px;overflow:auto}
.modal .box{background:#fff;border-radius:28px;padding:26px 20px;max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.modal .box p{margin:0}
.chest-e{font-size:5rem;line-height:1}
.balloons,.pond{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;width:100%;padding:8px 0}
.balloon{position:relative;width:88px;height:106px;border-radius:50% 50% 46% 46%;border:0;background:var(--bc,#E0457B);color:#fff;font:800 2rem var(--body);box-shadow:inset -8px -8px 0 rgba(0,0,0,.12);animation:bob 2.6s ease-in-out infinite;animation-delay:var(--d,0s);padding:0;margin-bottom:28px}
.balloon::after{content:'';position:absolute;left:50%;top:100%;width:2px;height:26px;background:#9a8aa6;transform:translateX(-50%)}
.balloon.good{background:var(--mint);animation:celeb .7s ease}
.pond{background:linear-gradient(#DFF3FF,#BFE6FF);border-radius:22px;padding:20px;gap:20px}
.fish{position:relative;min-width:108px;height:70px;border-radius:40px 28px 28px 40px;border:0;background:var(--fc,#3E8EDE);color:#fff;font:800 1.9rem var(--body);padding:0 18px 0 20px;animation:swim 3s ease-in-out infinite;animation-delay:var(--d,0s);margin-right:18px}
.fish::after{content:'';position:absolute;right:-16px;top:50%;transform:translateY(-50%);border:18px solid transparent;border-left:18px solid var(--fc,#3E8EDE);border-right:0}
.fish.good{background:var(--mint);animation:celeb .7s ease}
.track{position:relative;width:100%;height:34px;border-bottom:3px dotted var(--line)}
.track i{position:absolute;bottom:2px;font-style:normal;font-size:1.6rem;transition:left .5s}
.track b{position:absolute;right:0;bottom:0;font-size:1.7rem}
.tracebox{position:relative;width:100%;max-width:360px;height:230px;touch-action:none}
.tracebox canvas{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:20px;touch-action:none}
#g1{background:#fff;border:3px solid var(--line)}
.pet{font-size:1.7rem;line-height:1}
.pet.jump{animation:celeb .7s}
.lt{text-align:center;font:800 1.05rem var(--display);color:var(--ink-soft)}
.sline{width:100%;background:var(--bg);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center}
.sline .ic{font-size:2.4rem;line-height:1}
.sline .ws{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.sline .tools{display:flex;gap:8px}
.wd{border:3px solid var(--line);background:#fff;border-radius:14px;padding:6px 12px;font:700 1.35rem var(--body)}
.back.recording{background:var(--rose);color:#fff;border-color:var(--rose-d)}
.wopts{display:flex;flex-direction:column;gap:10px;width:100%}
.wo{min-height:64px;border-radius:18px;border:3px solid var(--line);background:#fff;font:700 1.8rem var(--body);box-shadow:0 5px 0 var(--line)}
.wo.good{background:#DDF6EC;border-color:var(--mint)}
.chip{display:inline-block;border-radius:99px;padding:2px 12px;margin:2px;background:var(--bg);border:2px solid var(--line);font:700 1rem var(--body)}
.chip.bad{background:#FFE9F0;border-color:var(--rose)}
.chip.good{background:#DDF6EC;border-color:var(--mint)}
.emo{display:flex;flex-wrap:wrap;gap:6px}
.emo button{width:44px;height:44px;font-size:1.5rem;border-radius:12px;border:3px solid var(--line);background:#fff;padding:0}
.emo button.on{border-color:var(--sky);background:#EEF0FF}
.sy.blank{border-bottom:5px solid var(--gold);color:var(--gold);padding:0 .35em}
@media print{.no-print{display:none!important}body{background:#fff}#app{max-width:none;padding:0}}

@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes swim{50%{transform:translateX(12px)}}
.scene{container-type:inline-size;isolation:isolate;user-select:none;-webkit-user-select:none;background:#BFE6FF}
.scene .bg,.scene .bg svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene .nov{position:absolute;inset:0;background:rgba(16,14,60,.28);z-index:5;pointer-events:none}
.scene.arr{touch-action:none;outline:4px dashed var(--sky);outline-offset:-4px}
.ob{position:absolute;transform:translateX(-50%) scale(var(--s,1));transform-origin:50% 100%;cursor:pointer;-webkit-touch-callout:none}
.ob .wv{transition:transform 2s ease-in-out}
.ob .fl{transition:transform .3s}
.ob .fx{transform-origin:50% 100%}
.ob .em{display:block;font-size:34px;font-size:9cqw;line-height:1.05}
.ob .pc{width:72px;width:20cqw}
.ob .pc svg{width:100%;display:block}
.arr .ob{cursor:grab}
.ob.sel{z-index:999!important}
.ob.sel .fx{outline:3px dashed var(--sky);outline-offset:3px;border-radius:12px;background:rgba(255,255,255,.25)}
.sign{display:flex;flex-direction:column;align-items:center}
.sign b{background:#F2D6A2;border:3px solid #A0703F;border-radius:10px;padding:.1em .45em;font:700 15px var(--body);font-size:4.2cqw;color:#5A3A1A;white-space:nowrap}
.sign::after{content:'';display:block;width:6px;height:22px;height:6.5cqw;background:#A0703F;border-radius:2px}
.bub{position:absolute;left:50%;bottom:100%;transform:translateX(-50%) scale(calc(1 / var(--s,1)));transform-origin:50% 100%;background:#fff;border:3px solid var(--line);border-radius:16px;padding:3px 10px;font:700 15px var(--body);white-space:nowrap;color:var(--ink);z-index:2;margin-bottom:6px;box-shadow:0 3px 0 var(--line)}
.bub::after{content:'';position:absolute;left:50%;top:100%;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--line)}
.fx.walk{animation:aWalk .4s ease-in-out 5}
@keyframes aWalk{50%{transform:translateY(-6%) rotate(3deg)}}
.fx.a-jump{animation:aJump .8s ease}
@keyframes aJump{30%{transform:translateY(-28%) scale(1.05,.95)}55%{transform:translateY(0) scale(1.1,.9)}75%{transform:translateY(-8%)}}
.fx.a-spin{animation:aSpin .9s ease}
@keyframes aSpin{to{transform:rotateY(360deg)}}
.fx.a-wig,.fx.a-wave{animation:aWig .6s ease}
.fx.a-wave{animation-iteration-count:2}
@keyframes aWig{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.fx.a-pop{animation:pop .5s}
.av .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.ob.me .pc,.hero-av .av{animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scale(1.015,1.03)}}
.hero-av{cursor:pointer}
.hero-av.jumpy .av{animation:aJump .8s ease}
.night .tw{animation:tw 2s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.wx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:600}
.wx .p{position:absolute;top:-12%;line-height:1}
.wx .fall{font-size:18px;font-size:4.5cqw;animation:wxFall linear infinite}
.wx .drop{width:2px;height:16px;background:rgba(70,110,200,.65);border-radius:2px;animation:wxFall linear infinite}
.wx .bubble{width:18px;height:18px;width:4.5cqw;height:4.5cqw;border-radius:50%;border:2px solid rgba(255,255,255,.95);background:rgba(255,255,255,.25);animation:wxRise linear infinite}
.wx .fly{font-size:22px;font-size:5.5cqw;animation:wxFly ease-in-out infinite alternate}
.wx .fw{font-size:30px;font-size:9cqw;animation:wxFw ease-out infinite;opacity:0}
@keyframes wxFall{0%{top:-12%;transform:translateX(0) rotate(0)}50%{transform:translateX(12px) rotate(120deg)}100%{top:105%;transform:translateX(-8px) rotate(260deg)}}
@keyframes wxRise{from{top:105%}to{top:-12%}}
@keyframes wxFly{0%{transform:translate(0,0)}50%{transform:translate(30px,-20px) rotate(10deg)}100%{transform:translate(-24px,16px) rotate(-8deg)}}
@keyframes wxFw{0%{transform:scale(.1);opacity:0}20%{opacity:1}70%{transform:scale(1.2);opacity:1}100%{transform:scale(1.4);opacity:0}}
.rooms{flex-wrap:wrap}

.ctl{display:flex;flex-direction:column;gap:8px}
.ctl .hint{margin:0}
.addbar{display:flex;flex-direction:column;gap:8px;background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px}
.addbar p{margin:0}
.addbar .row{max-height:230px;overflow:auto}
.hint-a{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.92);border-radius:12px;padding:2px 10px;font:700 .8rem var(--body);z-index:700;pointer-events:none}
@media (prefers-reduced-motion:reduce){.wx{display:none}.av .eyes,.ob.me .pc,.hero-av .av,.night .tw{animation:none!important}.ob .wv{transition:none}}

function defLay(r){
  const o=ROOMDEF[r].map(a=>({k:a[0],x:a[1],y:a[2],s:1}));
  SHOP.filter(x=>x.cat==='deco'&&has(x.id)&&(x.r||'jardin')===r).forEach((d,j)=>{const a=d.at||[10+((j*23)%80),93];o.push({k:d.id,x:a[0],y:a[1],s:a[2]||1});});
  if(r==='jardin'){
    const other=new Set();['trono','cuarto'].forEach(q=>(P.lay[q]||[]).forEach(x=>other.add(x.k)));
    visOn().forEach((v,j)=>{if(!other.has('V:'+v))o.push({k:'V:'+v,x:12+j*12,y:84,s:.9});});
  }
  return o;
}
function ensureLay(){
  if(!P.lay||typeof P.lay!=='object')P.lay={};
  if(!RNAME[P.room])P.room='jardin';
  ROOMS.forEach(([r])=>{
    if(!Array.isArray(P.lay[r]))P.lay[r]=defLay(r);
    P.lay[r]=P.lay[r].filter(o=>o&&typeof o.k==='string'&&(o.k==='P'||o.k==='M'||o.k.startsWith('S:')||(o.k.startsWith('V:')&&VIS[+o.k.slice(2)])||has(o.k)));
    ['P','M'].forEach((k,j)=>{if(!P.lay[r].some(o=>o.k===k)){const d=ROOMDEF[r][j];P.lay[r].push({k,x:d[1],y:d[2],s:1});}});
  });
  const placed=new Set();ROOMS.forEach(([r])=>P.lay[r].forEach(o=>placed.add(o.k)));
  visOn().forEach(v=>{if(!placed.has('V:'+v))P.lay.jardin.push({k:'V:'+v,x:Math.round(15+Math.random()*70),y:84,s:.9});});
}

let MUS=null,MG=null;
function musicOff(){

}

      if(AC&&AC.state==='suspended')AC.resume();
      if(HAS_VOICE&&speechSynthesis.speaking)return;
      let k;do{k=Math.random()*n.length|0;}while(k===last);last=k;tone(n[k],0,1.8,.03,'sine',MG);
    }catch(e){}},1300);
  }else if(!want)musicOff();
}catch(e){}}

function silabas(txt){
  const w=String(txt).toLowerCase().replace(/[^a-záéíóúüñ]/g,'');
  if(!w)return[];
  const V='aeiouáéíóúü',u=[];
  for(let i=0;i<w.length;i++){
    const c=w[i],d=w[i+1],e=w[i+2];
    if((c==='c'&&d==='h')||(c==='l'&&d==='l')||(c==='r'&&d==='r')){u.push({t:c+d,v:false});i++;continue;}
    if((c==='q'||c==='g')&&d==='u'&&e&&'eiéí'.includes(e)){u.push({t:c+d,v:false});i++;continue;}
    if(c==='y'&&i===w.length-1&&i>0&&V.includes(w[i-1])){u.push({t:c,v:true,weak:true});continue;}
    u.push({t:c,v:V.includes(c),weak:'iuü'.includes(c)});
  }
  const nuc=[];
  for(let i=0;i<u.length;i++){
    if(!u[i].v)continue;
    const last=nuc[nuc.length-1];
    if(last&&last.end===i-1){
      if(!u[last.end].weak&&!u[i].weak)nuc.push({start:i,end:i});else last.end=i;
    }else nuc.push({start:i,end:i});
  }
  if(!nuc.length)return[w];
  const CL=['pr','pl','br','bl','fr','fl','cr','cl','gr','gl','tr','dr'],cuts=[0];
  for(let k=0;k<nuc.length-1;k++){
    const a=nuc[k].end+1,b=nuc[k+1].start,n=b-a;let cut;
    if(n===0)cut=b;else if(n===1)cut=a;
    else{const two=u[b-2].t+u[b-1].t;if(n===2)cut=CL.includes(two)?a:a+1;else if(n===3)cut=CL.includes(two)?a+1:a+2;else cut=a+2;}
    cuts.push(cut);
  }
  cuts.push(u.length);
  const out=[];for(let k=0;k<cuts.length-1;k++)out.push(u.slice(cuts[k],cuts[k+1]).map(x=>x.t).join(''));
  return out.filter(Boolean);
}

function makeCode(){
  return 'CL2-'+b64({v:2,n:P.name,g:P.gems,d:FLAT.map(l=>P.done[l.id]||0).join(''),inv:P.inv,eq:P.eq,stk:Object.keys(P.stk).join(','),days:Object.keys(P.days).sort().slice(-60).join(','),chest:P.chest,rw:P.rw,fam:P.fam.map(f=>[f.w,f.s.join('-'),f.e]),st:Object.entries(P.st).map(e=>e[0]+':'+e[1][0]+':'+Math.round(e[1][1]*10)/10).join(','),gen:P.gen,room:P.room,nt:P.night?1:0,lay:Object.fromEntries(Object.entries(P.lay||{}).map(([r,a])=>[r,a.map(o=>[o.k,o.x,o.y,o.s])]))});
}
function applyCode(txt){
  try{
    let c=txt.trim().replace(/\s+/g,'');
    const v2=/^CL2-/.test(c);
    if(!v2&&!/^CL1-/.test(c))return 'El código debe empezar con CL1- o CL2-';
    c=c.slice(4);while(c.length%4)c+='=';
    const o=JSON.parse(decodeURIComponent(escape(atob(c))));
    if(!o||typeof o.d!=='string'||!/^[0-3]*$/.test(o.d))return 'El código no es válido.';
    o.d.split('').forEach((ch,i)=>{const n=+ch;if(n>0&&FLAT[i])P.done[FLAT[i].id]=Math.max(P.done[FLAT[i].id]||0,n);});
    P.gems=Math.max(P.gems,+o.g||0);if(!P.name&&o.n)P.name=String(o.n).slice(0,16);
    if(v2){
      (o.inv||[]).forEach(id=>{if(item(id))give(id);});
      if(o.eq)P.eq=Object.assign(P.eq,o.eq);
      String(o.stk||'').split(',').filter(Boolean).forEach(k=>{P.stk[k]=1;});
      String(o.days||'').split(',').filter(Boolean).forEach(k=>{P.days[k]=1;});
      if(o.chest&&o.chest>P.chest)P.chest=o.chest;
      Object.assign(P.rw,o.rw||{});
      if(o.gen==='m'||o.gen==='f')P.gen=o.gen;
      if(o.room)P.room=o.room;if(o.nt!==undefined)P.night=!!o.nt;
      if(o.lay&&typeof o.lay==='object')Object.keys(o.lay).forEach(r=>{if(Array.isArray(o.lay[r]))P.lay[r]=o.lay[r].map(a=>({k:String(a[0]),x:+a[1]||50,y:+a[2]||90,s:+a[3]||1}));});
      (o.fam||[]).forEach(f=>{if(!P.fam.some(x=>x.w===f[0]))P.fam.push({w:f[0],s:String(f[1]).split('-'),e:f[2]});});
      String(o.st||'').split(',').filter(Boolean).forEach(x=>{const p=x.split(':');const a=P.st[p[0]]||(P.st[p[0]]=[0,0]);a[0]=Math.max(a[0],+p[1]||0);a[1]=Math.max(a[1],+p[2]||0);});
    }
    save();return '';
  }catch(e){return 'No pude leer ese código. Cópialo completo e inténtalo otra vez.';}
}

/* ---------- Lección ---------- */
let L=null,ctx=null,stage=null;
function stepsFor(l,pool){
  const full=P.mode!=='short';
  if(l.type==='vowel')return full?['warm','listen','trace','initial','memory','mission']:['warm','listen','initial','memory','mission'];
  if(l.boss)return ['listen','build','read','story','mission'];
  const st=['warm','listen','combine'];
  if(full)st.push('trace');
  if(pool.length>=2)st.push('build');
  if(pool.length>=1)st.push('read');
  if(full&&pool.length>=2)st.push('missing');
  st.push('mission');return st;
}
function startLesson(i){
  L=FLAT[i];viewPart=REINOS[L.ki].part;
  const pool=poolFor(i);
  ctx={i,res:[],step:0,mission:false,pool,skin:['tiles','globos','peces'][i%3]};
  ctx.steps=stepsFor(L,pool);
  shell();runStep();
}
function startFamily(){
  const pool=famAll();
  if(!pool.length){modal('<h2>Faltan palabras</h2><p>Pídele a papá o mamá que agregue palabras en el panel «Para papá y mamá».</p><button class="btn" data-close>Ok</button>');return;}
  const ci=Math.max(0,nextIdx()-1),known=new Set(KNOWN[ci]);
  pool.forEach(w=>w.s.forEach(x=>known.add(nz(x))));pool.neuN=pool.length;
  L={id:'fam',t:'Mis palabras',fam:true,sy:[]};
  ctx={i:ci,res:[],step:0,mission:false,pool,skin:'tiles',known:[...known],steps:['build','find']};
  shell();runStep();
}
function startReview(){
  const wk=weakList(),ci=Math.max(0,nextIdx()-1),ws=new Set(wk);
  let pool=WORDS.filter(w=>knows(w,KNOWN[ci])&&w.s.some(x=>ws.has(nz(x))));
  if(pool.length<2)pool=shuffle(WORDS.filter(w=>knows(w,KNOWN[ci]))).slice(0,6);
  pool.neuN=pool.length;
  L={id:'rev',t:'Repaso inteligente',review:true,sy:wk};
  ctx={i:ci,res:[],step:0,mission:false,pool,skin:'tiles',steps:['listen','build','read']};
  shell();runStep();
}
function shell(){
  app.innerHTML='';
  const bar=el('div','lessonbar');
  const bk=el('button','back','←');bk.setAttribute('aria-label','Volver al mapa');bk.onclick=()=>{try{speechSynthesis.cancel();}catch(e){}home();};

  const pe=petEmoji();if(pe)bar.appendChild(el('span','pet',pe));

  bar.appendChild(mb);app.appendChild(bar);
  app.appendChild(el('div','lt',L.t));
  stage=el('div','stage');stage.id='stage';app.appendChild(stage);
  stage.addEventListener('click',e=>{if(e.target.closest('.ask')&&ctx&&ctx.cur)say(instrText(ctx.cur));});
  window.scrollTo(0,0);
}
function dots(){document.querySelectorAll('.dots i').forEach((d,i)=>{d.className=i<ctx.step?'on':i===ctx.step?'now':'';});}
function stars(m,n){const r=m/n;return r<=.2?3:r<=.6?2:1;}
function nextStep(m,n){if(m!=null)ctx.res.push(stars(m,n));ctx.step++;runStep();}
const INSTR={
 warm:'Toca cada tarjeta y escucha cómo suena. Cuando termines, toca el botón verde.',
 listen:'Escucha el sonido. Toca el que suena igual.',
 combine:'Escucha la sílaba. Toca la vocal que falta para completarla.',

const instrText=k=>{const v=INSTR[k];return typeof v==='function'?v():v;};
const FIRST_SPEAK=['listen','combine','initial','build','missing','find','trace'];
function runStep(){
  dots();stage.innerHTML='';stage.className='stage';
  const s=ctx.steps[ctx.step];

  ({warm:gWarm,listen:gListen,combine:gCombine,trace:gTrace,initial:gInitial,memory:gMemory,build:gBuild,read:gRead,missing:gMissing,find:gFind,story:gStory,mission:gMission})[s](nextStep);

const ASK='<button class="ask" aria-label="Escuchar la instrucción">🔊</button>';
const runner=()=>petEmoji()||'🦄';
const head=(t,r,n)=>'<div class="gh">'+ASK+'<span class="gt">'+t+'</span><span class="gr">'+(r+1)+' de '+n+'</span></div><div class="track" aria-hidden="true"><i style="left:'+(n>1?Math.round(r/n*84):0)+'%">'+runner()+'</i><b>🏰</b></div>';
const seqWords=n=>{const p=ctx.pool,k=p.neuN||p.length;const base=shuffle(p.slice(0,k)).concat(shuffle(p.slice(k)));const out=[];for(let i=0;i<n;i++)out.push(base[i%base.length]);return out;};
const wrong=el_=>{el_.classList.add('shake');setTimeout(()=>el_.classList.remove('shake'),400);};
const PAL=['#E0457B','#6C63F0','#2FB890','#F5B52E','#3E8EDE','#8A4FD6'];
/* ---------- Juegos ---------- */

/* Escucha y toca: tarjetas, globos o peces */
function gListen(done){
  const pool=L.sy.slice(),n=L.boss?6:5,nopt=L.boss?4:3,skin=ctx.skin||'tiles';let r=0,m=0;
  const draw=deck(pool),known=[...(ctx.known||KNOWN[ctx.i])];
  (function round(){
    if(r>=n)return done(m,n);
    const t=draw();
    const others=shuffle(pool.filter(x=>x!==t)),extra=shuffle(known.filter(x=>x!==t&&!pool.includes(x)));
    const opts=shuffle([t].concat(others.concat(extra).slice(0,nopt-1)));
    const box=skin==='globos'?'balloons':skin==='peces'?'pond':'tiles';
    stage.innerHTML=head(skin==='globos'?'Revienta el globo':skin==='peces'?'Pesca la sílaba':'Escucha y toca la sílaba',r,n)+'<button class="spk" id="spk">🔊 Escuchar otra vez</button><div class="'+box+'" id="tt"></div><p class="fb" id="fb"></p>';
    let ok=false;
    opts.forEach((o,k)=>{
      const b=el('button',skin==='globos'?'balloon':skin==='peces'?'fish':'tile',o);
      if(skin==='globos'){b.style.setProperty('--bc',PAL[(k+r)%PAL.length]);b.style.setProperty('--d',(k*.35)+'s');}
      if(skin==='peces'){b.style.setProperty('--fc',PAL[(k+r+2)%PAL.length]);b.style.setProperty('--d',(k*.5)+'s');}
      b.onclick=()=>{
        if(ok)return;
        if(o===t){ok=true;rec(t,true);hit(b);say(t);burst(6);r++;setTimeout(()=>{if(stage.isConnected)round();},1200);}
        else{m++;rec(t,false);wrong(b);fb('Casi. Escucha otra vez.');say(t);}
      };
      $('#tt').appendChild(b);
    });
    $('#spk').onclick=()=>say(t);
    setTimeout(()=>speakFirst(t),250);
  })();
}

/* Repasa con el dedo */
function gTrace(done){
  const items=shuffle(L.sy).slice(0,L.boss?3:2),n=items.length;let r=0,m=0;
  (function round(){
    if(r>=n)return done(m,n);
    const txt=items[r];
    stage.innerHTML=head('Repasa con el dedo',r,n)+'<div class="tracebox" id="tb"><canvas id="g1"></canvas><canvas id="g2"></canvas></div><div class="row"><button class="btn alt sm" id="clr">Borrar</button><button class="btn mint sm" id="okb">¡Listo!</button></div><p class="fb" id="fb"></p>';
    const box=$('#tb'),g1=$('#g1'),g2=$('#g2');
    const W=Math.max(220,Math.min(360,box.clientWidth||300)),H=230,dpr=Math.min(2,window.devicePixelRatio||1);
    let c1=null,c2=null,mk=null,mkd=null;
    try{
      [g1,g2].forEach(c=>{c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);});
      c1=g1.getContext('2d');c2=g2.getContext('2d');
      mk=document.createElement('canvas');mk.width=g1.width;mk.height=g1.height;
    }catch(e){}
    if(!c1||!c2||!mk||!mk.getContext('2d')){fb('Aquí no se puede escribir. Seguimos.');setTimeout(()=>{if(stage.isConnected)done(m,n);},900);return;}
    const mc=mk.getContext('2d');
    const draw=(cx,fill,stroke)=>{cx.setTransform(dpr,0,0,dpr,0,0);let fs=150;cx.font='700 '+fs+'px Andika, sans-serif';const mw=cx.measureText(txt).width||1;fs=Math.min(150,fs*(W*.82)/mw);cx.font='700 '+fs+'px Andika, sans-serif';cx.textAlign='center';cx.textBaseline='middle';
      if(fill){cx.fillStyle=fill;cx.fillText(txt,W/2,H/2+8);}
      if(stroke){cx.setLineDash([7,7]);cx.lineWidth=2;cx.strokeStyle=stroke;cx.strokeText(txt,W/2,H/2+8);cx.setLineDash([]);}};
    c1.setTransform(1,0,0,1,0,0);c1.fillStyle='#fff';c1.fillRect(0,0,g1.width,g1.height);
    draw(c1,'#F1E7F7','#B79BC9');
    draw(mc,'#000',null);
    try{mkd=mc.getImageData(0,0,mk.width,mk.height).data;}catch(e){mkd=null;}
    c2.setTransform(dpr,0,0,dpr,0,0);c2.lineWidth=22;c2.lineCap='round';c2.lineJoin='round';c2.strokeStyle='#E0457B';
    let down=false,lx=0,ly=0;
    const pos=e=>{const b=g2.getBoundingClientRect();return[(e.clientX-b.left)*(W/(b.width||W)),(e.clientY-b.top)*(H/(b.height||H))];};
    g2.onpointerdown=e=>{e.preventDefault();down=true;[lx,ly]=pos(e);c2.beginPath();c2.moveTo(lx,ly);c2.lineTo(lx+.1,ly);c2.stroke();try{g2.setPointerCapture(e.pointerId);}catch(_){}};
    g2.onpointermove=e=>{if(!down)return;e.preventDefault();const[x,y]=pos(e);c2.beginPath();c2.moveTo(lx,ly);c2.lineTo(x,y);c2.stroke();lx=x;ly=y;};
    const up=()=>{down=false;};g2.onpointerup=up;g2.onpointercancel=up;g2.onpointerleave=up;
    $('#clr').onclick=()=>{c2.save();c2.setTransform(1,0,0,1,0,0);c2.clearRect(0,0,g2.width,g2.height);c2.restore();};
    $('#okb').onclick=()=>{
      let tot=0,cov=0,inkA=0;
      try{
        const ink=c2.getImageData(0,0,g2.width,g2.height).data;
        for(let i=3;i<ink.length;i+=16){const a=mkd[i]>128,b=ink[i]>0;if(a){tot++;if(b)cov++;}if(b)inkA++;}
      }catch(e){tot=1;cov=1;}

      else{m++;fb(tot>0&&cov/tot<.6?'Sigue la sílaba gris con el dedo.':'Casi. Borra e inténtalo otra vez.');}
    };
    setTimeout(()=>speakFirst(txt),300);
  })();
}

    shuffle([w].concat(others)).forEach(o=>{const b=el('button','opt',o.e);b.setAttribute('aria-label','Dibujo');b.onclick=()=>{
      if(ok)return;
      if(o===w){ok=true;w.s.forEach(x=>rec(x,true));hit(b);say(w.w,.95);burst(8);r++;setTimeout(()=>{if(stage.isConnected)round();},1800);}
      else{m++;w.s.forEach(x=>rec(x,false));wrong(b);fb('Casi. Léela otra vez.');}
    };$('#oo').appendChild(b);});
    $('#spk').onclick=()=>say(w.w,.95);
  })();
}

/* ¿Qué sílaba falta? */
function gMissing(done){
  const n=3,items=seqWords(n).filter(w=>w.s.length>=2);let r=0,m=0;
  const known=[...(ctx.known||KNOWN[ctx.i])];
  (function round(){
    if(r>=n||r>=items.length)return done(m,n);
    const w=items[r],idx=Math.random()*w.s.length|0,tg=w.s[idx],plain=w.s.map(nz);
    const dis=shuffle(known.filter(x=>x.length>1&&!plain.includes(x))).slice(0,2);
    stage.innerHTML=head('¿Qué sílaba falta?',r,n)+'<div class="pic">'+(w.e||'⭐')+'</div><div class="word">'+w.s.map((s,i)=>i===idx?'<span class="sy blank" id="bl">?</span>':'<span class="sy c'+(i%2)+'">'+s+'</span>').join('')+'</div><button class="spk" id="spk">🔊 Escuchar</button><div class="tiles" id="tt"></div><p class="fb" id="fb"></p>';
    let ok=false;
    shuffle([tg].concat(dis)).forEach(o=>{const b=el('button','tile',o);b.onclick=()=>{
      if(ok)return;
      if(o===tg){ok=true;rec(tg,true);$('#bl').textContent=tg;$('#bl').className='sy c0';hit(b);say(w.w,.95);burst(6);r++;setTimeout(()=>{if(stage.isConnected)round();},1800);}
      else{m++;rec(tg,false);wrong(b);fb('Casi. Escucha otra vez.');}
    };$('#tt').appendChild(b);});
    $('#spk').onclick=()=>say(w.w,.95);
    setTimeout(()=>speakFirst(w.w,.95),250);
  })();
}

/* Escucha y toca la palabra escrita (palabras de la familia) */
function gFind(done){
  const n=4,items=seqWords(n);let r=0,m=0;
  (function round(){
    if(r>=n)return done(m,n);
    const w=items[r];
    let others=shuffle(ctx.pool.filter(x=>x.w!==w.w));
    if(others.length<2)others=others.concat(shuffle(WORDS.filter(x=>x.w!==w.w)).slice(0,2-others.length));
    const opts=shuffle([w].concat(others.slice(0,2)));
    stage.innerHTML=head('Escucha y toca la palabra',r,n)+'<div class="pic">'+(w.e||'⭐')+'</div><button class="spk" id="spk">🔊 Escuchar</button><div class="wopts" id="wo"></div><p class="fb" id="fb"></p>';
    let ok=false;
    opts.forEach(o=>{const b=el('button','wo',esc(o.w));b.onclick=()=>{
      if(ok)return;
      if(o.w===w.w){ok=true;hit(b);say(w.w,.95);burst(8);r++;setTimeout(()=>{if(stage.isConnected)round();},1700);}
      else{m++;wrong(b);fb('Casi. Escucha otra vez.');say(w.w,.95);}
    };$('#wo').appendChild(b);});
    $('#spk').onclick=()=>say(w.w,.95);
    setTimeout(()=>speakFirst(w.w,.95),250);
  })();
}

/* Cuento con palabras tocables y grabación */
let RECS=null;
async function recToggle(mic,pl){
  if(RECS&&RECS.btn===mic&&RECS.mr.state==='recording'){RECS.mr.stop();return;}
  if(!(navigator.mediaDevices&&window.MediaRecorder)){fb('Este navegador no puede grabar.');return;}
  try{
    try{speechSynthesis.cancel();}catch(e){}
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    const mr=new MediaRecorder(s),ch=[];
    mr.ondataavailable=e=>ch.push(e.data);
    mr.onstop=()=>{
      s.getTracks().forEach(t=>t.stop());mic.textContent='🎤';mic.classList.remove('recording');
      const url=URL.createObjectURL(new Blob(ch,{type:mr.mimeType||'audio/webm'}));
      if(pl._u)URL.revokeObjectURL(pl._u);pl._u=url;pl.style.display='';
      pl.onclick=()=>{try{new Audio(url).play();}catch(e){}};
      try{new Audio(url).play();}catch(e){}
    };
    mr.start();RECS={mr,btn:mic};mic.textContent='⏹';mic.classList.add('recording');
  }catch(e){fb('No pude usar el micrófono aquí. Abre la app desde su página en GitHub y permite el micrófono.');}
}
function gStory(done){
  stage.innerHTML='<div class="gh">'+ASK+'<span class="gt">Tu cuento</span></div><p class="hint">Léelo tú primero. Toca una palabra para oírla. Con 🎤 puedes grabarte leyendo.</p><div id="ln" style="width:100%;display:flex;flex-direction:column;gap:10px"></div><p class="fb" id="fb"></p><button class="btn mint" id="nx">¡Lo leí!</button>';
  L.story.forEach(o=>{
    const d=el('div','sline','<div class="ic">'+o.e+'</div><div class="ws"></div><div class="tools"></div>');
    o.t.split(/\s+/).forEach(wd=>{const b=el('button','wd',wd);b.onclick=()=>say(wd.replace(/[.,]/g,''),.95);d.querySelector('.ws').appendChild(b);});
    const sp=el('button','back','🔊');sp.setAttribute('aria-label','Escuchar la frase');sp.onclick=()=>say(o.t);
    const mic=el('button','back','🎤');mic.setAttribute('aria-label','Grabar mi voz');
    const pl=el('button','back','▶');pl.style.display='none';pl.setAttribute('aria-label','Escuchar mi grabación');
    mic.onclick=()=>recToggle(mic,pl);
    const tl=d.querySelector('.tools');tl.appendChild(sp);tl.appendChild(mic);tl.appendChild(pl);
    $('#ln').appendChild(d);
  });
  $('#nx').onclick=()=>{burst(14);say('¡Qué bien lees, '+P.name+'!');setTimeout(()=>done(0,1),900);};
}

/* Misión */
function missionText(){
  if(L.type==='vowel')return 'Busca en casa 3 cosas que empiecen con A, E, I, O o U. Dile sus nombres a mamá o papá.';
  if(L.boss)return 'Dibuja tu palabra favorita de este reino y escribe su nombre debajo. Luego léesela a alguien de tu familia.';
  return 'Busca en casa 2 cosas que tengan '+L.sy.slice(0,3).join(', ')+' en el nombre. Dibuja una y escribe la sílaba.';
}
function gMission(){
  stage.innerHTML='<div class="gh">'+ASK+'<span class="gt">'+G('Misión de princesa','Misión de príncipe')+'</span></div><div class="mission">'+missionText()+'</div><p class="hint">Cuando la cumplas, toca el botón y gana una gema.</p><button class="btn" id="mc">Misión cumplida 💎</button><button class="btn alt sm" id="sk">Hoy no, terminar</button>';
  $('#mc').onclick=()=>{ctx.mission=true;burst(10);finish();};
  $('#sk').onclick=()=>finish();
}

/* Premio */
function finish(){
  const avg=ctx.res.length?ctx.res.reduce((a,b)=>a+b,0)/ctx.res.length:3;
  const st=Math.max(1,Math.min(3,Math.round(avg)));
  const special=!!(L.fam||L.review),first=!special&&!P.done[L.id];
  const gain=st+(ctx.mission?1:0),extra=[];
  P.days[today()]=1;
  if(!special){
    P.done[L.id]=Math.max(P.done[L.id]||0,st);
    if(!P.stk[L.id]){P.stk[L.id]=1;extra.push('Sticker nuevo: '+STICK[L.ki][FLAT.filter(x=>x.ki===L.ki).indexOf(L)]);}
    if(L.boss&&first)(REWARD[L.ki]||[]).forEach(id=>{if(!has(id)){give(id);const it=item(id);extra.push('Premio: '+nm(it)+' '+(it.e||''));}});
  }
  if(!special&&L.boss&&first&&VIS[L.ki])extra.push('¡Llegó una visita a tu castillo! '+VIS[L.ki].e+' '+VIS[L.ki].n);
  P.gems+=gain;save();
  const last=!special&&FLAT.indexOf(L)===FLAT.length-1;
  shell();dots();document.querySelectorAll('.dots i').forEach(d=>d.className='on');
  stage.innerHTML='<h2>'+(last?G('¡Princesa lectora!','¡Príncipe lector!'):'¡Lo lograste, '+esc(P.name)+'!')+'</h2><div class="stars" aria-label="'+st+' de 3 estrellas">'+'★'.repeat(st)+'<span class="off">'+'★'.repeat(3-st)+'</span></div><p>Ganaste <b>'+gain+' 💎</b>'+(ctx.mission?' (con la misión)':'')+'.</p>'+extra.map(x=>'<div class="mission" style="padding:10px">'+x+'</div>').join('')+'<p class="hint">'+(last?'Completaste todo el camino. Revisa tu álbum y tus certificados.':first?'Mañana te espera el siguiente día.':'Repasar también te hace más fuerte.')+'</p>';
  const row=el('div','row');
  if(L.boss&&first){const cb=el('button','btn alt','🏅 Ver mi certificado');cb.onclick=()=>cert(L.ki);row.appendChild(cb);}
  const b=el('button','btn','Ver el mapa');b.onclick=home;row.appendChild(b);stage.appendChild(row);
  burst(24);say(last?G('Eres una princesa lectora','Eres un príncipe lector'):'Lo lograste, '+P.name);
}

home();
